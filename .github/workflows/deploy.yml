name: Deploy

on:
  push:
    branches:
      - main

jobs:
  ci-cd:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run Security Audit
        run: npm audit --audit-level=high || true

      - name: Run Lint
        run: npm run lint

      - name: Run Typecheck
        run: npx tsc --noEmit

      - name: Run Tests
        run: npm test

      - name: Prisma Generate
        run: npx prisma generate

      - name: Build Next.js
        env:
          # Pastikan DATABASE_URL ditambahkan di Github Secrets jika ada halaman yang pre-render (ISR/SSG)
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run build

      # NOTE: build di atas hanya validasi (gate) sebelum deploy. Build produksi
      # yang sesungguhnya dijalankan LANGSUNG di VPS (lihat step di bawah), karena:
      # 1. argon2 adalah native module yang harus dikompilasi untuk OS target (Ubuntu 24.04 VPS)
      # 2. TARGET_DIR di VPS adalah git checkout persisten (bukan folder sekali-pakai),
      #    jadi deploy dilakukan lewat git pull + build ulang, BUKAN rsync --delete
      #    (rsync --delete pernah menghapus .git/prisma/src di TARGET_DIR karena isi
      #    foldernya diganti total dengan folder .next/standalone yang minimal).
      - name: Deploy to VPS
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          HOST: ${{ secrets.SERVER_HOST }}
          USER: ${{ secrets.SERVER_USER }}
          TARGET_DIR: ${{ secrets.SERVER_TARGET_DIR }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H $HOST >> ~/.ssh/known_hosts

          ssh $USER@$HOST "cd $TARGET_DIR \
            && git fetch origin main \
            && git reset --hard origin/main \
            && git clean -fd -e .env -e node_modules -e .next \
            && npm install \
            && npx prisma generate \
            && npm rebuild argon2 \
            && npx prisma migrate deploy \
            && npm run build \
            && cp -a public .next/standalone/ \
            && cp -a .next/static .next/standalone/.next/ \
            && mkdir -p .next/standalone/node_modules \
            && cp -a node_modules/@prisma .next/standalone/node_modules/ \
            && cp -a node_modules/.prisma .next/standalone/node_modules/ \
            && cp -a node_modules/prisma .next/standalone/node_modules/ \
            && cp -a node_modules/argon2 .next/standalone/node_modules/ \
            && cp ecosystem.config.js .next/standalone/ \
            && (pm2 delete homelink || true) \
            && pm2 start ecosystem.config.js \
            && pm2 save \
            && echo 'Waiting for server to verify health...' \
            && (for i in 1 2 3 4; do curl -s -f http://localhost:3002/api/health && break || sleep 5; done)"
