name: Deploy

on:
  push:
    branches:
      - main

jobs:
  ci-cd:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run Security Audit
        run: npm audit --audit-level=high || true

      - name: Run Lint
        run: npm run lint

      - name: Run Typecheck
        run: npx tsc --noEmit

      - name: Run Tests
        run: npm test

      - name: Prisma Generate
        run: npx prisma generate

      - name: Build Next.js
        env:
          # Pastikan DATABASE_URL ditambahkan di Github Secrets jika ada halaman yang pre-render (ISR/SSG)
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run build

      - name: Prepare Standalone Build
        run: |
          # Next.js standalone tidak memaketkan external deps (Prisma & Argon2), jadi kita copy manual
          cp -a public .next/standalone/
          cp -a .next/static .next/standalone/.next/
          mkdir -p .next/standalone/node_modules
          cp -a node_modules/@prisma .next/standalone/node_modules/ || true
          cp -a node_modules/prisma .next/standalone/node_modules/ || true
          cp -a node_modules/argon2 .next/standalone/node_modules/ || true
          cp ecosystem.config.js .next/standalone/

      - name: Deploy via Rsync and PM2
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          HOST: ${{ secrets.SERVER_HOST }}
          USER: ${{ secrets.SERVER_USER }}
          TARGET_DIR: ${{ secrets.SERVER_TARGET_DIR }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H $HOST >> ~/.ssh/known_hosts

          # Sync HANYA folder standalone yang sudah siap pakai ke VPS
          # Hapus file lama di VPS kecuali .env
          rsync -avz --delete \
            --exclude='.env' \
            .next/standalone/ $USER@$HOST:$TARGET_DIR/

          # Jalankan Migrasi dan Restart PM2 di VPS
          ssh $USER@$HOST "cd $TARGET_DIR \
            && npx prisma migrate deploy \
            && pm2 start ecosystem.config.js \
            && pm2 save \
            && echo 'Waiting for server to verify health...' \
            && (for i in 1 2 3 4; do curl -s -f http://localhost:3002/api/health && break || sleep 5; done)"
