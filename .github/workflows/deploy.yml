name: Deploy

on:
  push:
    branches:
      - main

jobs:
  ci-cd:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run Lint
        run: npm run lint

      - name: Run Typecheck
        run: npx tsc --noEmit

      - name: Run Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Deploy via Rsync and PM2
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          HOST: ${{ secrets.SERVER_HOST }}
          USER: ${{ secrets.SERVER_USER }}
          TARGET_DIR: ${{ secrets.SERVER_TARGET_DIR }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H $HOST >> ~/.ssh/known_hosts
          
          rsync -avz --delete --exclude='.git' --exclude='node_modules' --exclude='.env' --exclude='.env.*' ./ $USER@$HOST:$TARGET_DIR
          
          ssh $USER@$HOST "cd $TARGET_DIR && npm install && npx prisma generate && npm run build && (pm2 describe homelink > /dev/null && pm2 restart homelink || pm2 start npm --name homelink -- start -- -p 3002)"
